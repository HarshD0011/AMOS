apiVersion: v1
kind: Namespace
metadata:
  name: amos

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amos-operator
  namespace: amos

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amos-operator
rules:
  - apiGroups: ["", "apps", "batch", "rbac.authorization.k8s.io"]
    resources:
      [
        "pods",
        "pods/log",
        "events",
        "deployments",
        "jobs",
        "serviceaccounts",
        "services",
        "configmaps",
        "secrets",
        "clusterroles",
        "clusterrolebindings",
      ]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amos-operator
subjects:
  - kind: ServiceAccount
    name: amos-operator
    namespace: amos
roleRef:
  kind: ClusterRole
  name: amos-operator
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amos-operator
  namespace: amos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amos-operator
  template:
    metadata:
      labels:
        app: amos-operator
    spec:
      serviceAccountName: amos-operator
      containers:
        - name: amos
          image: amos:v1 # Ensure you load this image into Kind: kind load docker-image amos:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: ui
              protocol: TCP
          env:
            - name: GOOGLE_API_KEY
              value: "AIzaSyBSVRMGt1B0cKjUdsnFbSniBUXkyjYdkzQ" # Update manually or use secret
            - name: EMAIL_SMTP_HOST
              value: "smtp.gmail.com"
            - name: EMAIL_SMTP_PORT
              value: "587"
            - name: EMAIL_USER
              value: "harshmr11@gmail.com"
            - name: EMAIL_PASSWORD
              value: "without_me"
            - name: ENGINEER_EMAIL
              value: "harshtheman011@gmail.com"

---
apiVersion: v1
kind: Service
metadata:
  name: amos-ui
  namespace: amos
spec:
  selector:
    app: amos-operator
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
  type: NodePort
